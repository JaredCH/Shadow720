<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No maximum-scale or user-scalable=no: those block pinch zoom for the whole
      app, which is an accessibility failure. The map handles its own pinch
      because it sets touch-action: none, so page zoom and map zoom do not fight.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Shadow720</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
